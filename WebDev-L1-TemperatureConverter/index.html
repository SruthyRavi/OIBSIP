
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and responsive temperature converter.">
    <title>Tempora | Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-container">

        <div class="icon">🌡️</div>

        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures easily and accurately.</p>

        <div class="converter-card">

            <label for="temperature">Enter Temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="Enter a value"
                step="any"
            >

            <label for="unit">Convert From</label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert Temperature</button>

            <p id="errorMessage" class="error-message"></p>

            <div class="results" id="results">
                <h2>Conversion Results</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>
            </div>

        </div>

        <footer>
            <p>Built by Sruthy Ravi | OIBSIP Web Development</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
